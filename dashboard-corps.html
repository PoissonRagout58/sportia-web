<html lang="fr">

<title>SportIA — Relevé corporel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f18;
    --panel: #12172380;
    --panel-solid: #131926;
    --border: #232b3a;
    --text: #eef1f5;
    --text-dim: #8791a0;
    --text-dimmer: #4d5566;
    --accent: #4fd1b0;

    --m1-0: #1a1d23; --m1-1: #7a3a1f; --m1-2: #d6642c; --m1-3: #f2924a;
    --m2-0: #1a1d23; --m2-1: #1c5c58; --m2-2: #2ba394; --m2-3: #58d6c2;
    --m3-0: #1a1d23; --m3-1: #4a3470; --m3-2: #8259c2; --m3-3: #b58af0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #131a29 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    padding: 24px 18px 56px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1080px; margin: 0 auto; }

  header {
    display: flex; justify-content: space-between; align-items: flex-start;
    flex-wrap: wrap; gap: 14px; margin-bottom: 26px;
  }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--text-dim); margin: 0 0 4px; }
  h1 { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .mock-note { font-size: 12px; color: var(--text-dimmer); max-width: 260px; text-align: right; line-height: 1.5; }

  .tabs { display: flex; gap: 6px; margin-bottom: 22px; flex-wrap: wrap; }
  .tab {
    font-size: 13px; font-weight: 600; background: var(--panel-solid); border: 1px solid var(--border);
    color: var(--text-dim); padding: 10px 16px; border-radius: 8px; cursor: pointer; transition: all 0.15s ease;
  }
  .tab:hover { color: var(--text); border-color: #34405a; }
  .tab.active[data-mode="1"] { color: var(--m1-3); border-color: var(--m1-2); background: #241a15; }
  .tab.active[data-mode="2"] { color: var(--m2-3); border-color: var(--m2-2); background: #14201f; }
  .tab.active[data-mode="3"] { color: var(--m3-3); border-color: var(--m3-2); background: #1c1730; }

  .layout { display: grid; grid-template-columns: minmax(0, 460px) 1fr; gap: 20px; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

  .body-panel {
    background: var(--panel-solid); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 14px 14px;
  }

  svg.mannequin { width: 100%; height: auto; display: block; }

  .view-label { font-size: 5px; font-weight: 600; fill: var(--text-dimmer); letter-spacing: 0.06em; }

  .zone {
    cursor: pointer; stroke: rgba(255,255,255,0.06); stroke-width: 0.3;
    transition: fill 0.5s ease, stroke 0.15s ease, opacity 0.15s ease;
  }
  .zone:hover { stroke: rgba(255,255,255,0.5); }
  .zone.selected { stroke: #fff; stroke-width: 0.6; }

  .static { fill: #232a38; stroke: none; }

  .side { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--panel-solid); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; }
  .card h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; color: var(--text-dim); margin: 0 0 14px; }
  .legend-bar { height: 8px; border-radius: 4px; margin-bottom: 8px; }
  .legend-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); }

  .readout { min-height: 130px; display: flex; flex-direction: column; justify-content: center; }
  .readout .empty { font-size: 13px; color: var(--text-dimmer); }
  .readout .zone-name { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
  .readout .zone-value { font-size: 30px; font-weight: 800; margin: 4px 0 8px; letter-spacing: -0.01em; }
  .readout .zone-note { font-size: 13px; color: var(--text-dim); line-height: 1.55; }

  .legend-chip { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--text-dim); margin-top: 4px; padding: 5px 0; cursor: pointer; }
  .legend-chip:hover { color: var(--text); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .chip-list { max-height: 360px; overflow-y: auto; padding-right: 4px; }
</style>
</head>

    'shoulder-l': 85, 'shoulder-r': 84, 'chest': 60, 'arm-l': 55, 'arm-r': 56,
    'forearm-l': 40, 'forearm-r': 41, 'abs': 70, 'oblique-l': 65, 'oblique-r': 65,
    'quad-l': 50, 'quad-r': 51, 'calf-l': 42, 'calf-r': 42,
    'trap': 58, 'lat-l': 62, 'lat-r': 61, 'triceps-l': 53, 'triceps-r': 54,
    'lowerback': 35, 'glute-l': 45, 'glute-r': 46, 'hamstring-l': 38, 'hamstring-r': 39,
  };

  const modes = {
    1: {
      title: 'Sollicitation récente', stops: ['--m1-0','--m1-1','--m1-2','--m1-3'],
      legendMin: 'Récupéré (7j+)', legendMax: "Sollicité hier",
      getT: id => 1 - Math.min(daysAgo[id], 7) / 7,
      getValueLabel: id => daysAgo[id] === 0 ? "Aujourd'hui" : `Il y a ${daysAgo[id]} j`,
      getNote: id => daysAgo[id] <= 2 ? "Zone encore en phase de récupération active — muscle sollicité récemment."
        : daysAgo[id] <= 5 ? "Récupération avancée, prêt pour une nouvelle sollicitation modérée."
        : "Zone reposée depuis un moment — bonne candidate pour ta prochaine séance.",
    },
    2: {
      title: 'Points forts fonctionnels', stops: ['--m2-0','--m2-1','--m2-2','--m2-3'],
      legendMin: 'À développer', legendMax: 'Point fort',
      getT: id => functionalScore[id] / 100,
      getValueLabel: id => `${functionalScore[id]}/100`,
      getNote: id => functionalScore[id] >= 70 ? "Niveau fonctionnel solide sur cette zone par rapport à ton standard."
        : functionalScore[id] >= 50 ? "Niveau correct, marge de progression identifiée."
        : "Zone à prioriser dans les prochains cycles d'entraînement.",
    },
    3: {
      title: 'Points forts visuels', stops: ['--m3-0','--m3-1','--m3-2','--m3-3'],
      legendMin: 'Discret', legendMax: 'Atout visuel',
      getT: id => visualScore[id] / 100,
      getValueLabel: id => `${visualScore[id]}/100`,
      getNote: id => visualScore[id] >= 70 ? "Ressort clairement dans ta silhouette d'après l'analyse photo."
        : visualScore[id] >= 50 ? "Présent visuellement, peut encore gagner en définition."
        : "Zone moins visible actuellement — bon axe pour un travail esthétique ciblé.",
    },
  };

  let currentMode = 1;
  let selectedZone = null;

  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function hexToRgb(hex) { const h = hex.replace('#',''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
  function rgbToHex([r,g,b]) { return '#' + [r,g,b].map(v => Math.round(v).toString(16).padStart(2,'0')).join(''); }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function colorAt(stopsHex, t) {
    t = Math.max(0, Math.min(1, t));
    const segments = stopsHex.length - 1;
    const scaled = t * segments;
    const i = Math.min(Math.floor(scaled), segments - 1);
    const localT = scaled - i;
    const c1 = hexToRgb(stopsHex[i]); const c2 = hexToRgb(stopsHex[i+1]);
    return rgbToHex([lerp(c1[0],c2[0],localT), lerp(c1[1],c2[1],localT), lerp(c1[2],c2[2],localT)]);
  }

  function applyMode(modeNum) {
    currentMode = modeNum;
    const mode = modes[modeNum];
    const stopsHex = mode.stops.map(cssVar);

    document.querySelectorAll('.zone').forEach(el => {
      const id = el.dataset.id;
      const t = mode.getT(id);
      el.style.fill = colorAt(stopsHex, t);
    });

    document.getElementById('legendTitle').textContent = mode.title;
    document.getElementById('legendMin').textContent = mode.legendMin;
    document.getElementById('legendMax').textContent = mode.legendMax;
    document.getElementById('legendBar').style.background = `linear-gradient(90deg, ${stopsHex.join(',')})`;

    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', Number(t.dataset.mode) === modeNum));

    renderChipList(mode, stopsHex);
    if (selectedZone) renderReadout(selectedZone);
  }

  function renderChipList(mode, stopsHex) {
    const list = document.getElementById('chipList');
    list.innerHTML = '';
    Object.keys(zoneLabels).forEach(id => {
      const t = mode.getT(id);
      const color = colorAt(stopsHex, t);
      const chip = document.createElement('div');
      chip.className = 'legend-chip';
      chip.innerHTML = `<span class="dot" style="background:${color}"></span>${zoneLabels[id]} — ${mode.getValueLabel(id)}`;
      chip.addEventListener('click', () => selectZone(id));
      list.appendChild(chip);
    });
  }

  function renderReadout(id) {
    const mode = modes[currentMode];
    const card = document.getElementById('readoutCard');
    const sampleEl = document.querySelector('[data-id="'+id+'"]');
    card.innerHTML = `
      <p class="zone-name">${zoneLabels[id]}</p>
      <p class="zone-value" style="color:${sampleEl.style.fill}">${mode.getValueLabel(id)}</p>
      <p class="zone-note">${mode.getNote(id)}</p>
    `;
  }

  function selectZone(id) {
    document.querySelectorAll('.zone').forEach(z => z.classList.toggle('selected', z.dataset.id === id));
    selectedZone = id;
    renderReadout(id);
  }

  document.querySelectorAll('.zone').forEach(el => {
    el.addEventListener('click', () => selectZone(el.dataset.id));
  });
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => applyMode(Number(tab.dataset.mode)));
  });

  applyMode(1);
</script>

</body>
</html>
