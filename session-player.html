<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportIA — Séance guidée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f18; --panel-solid: #131926; --border: #232b3a;
    --text: #eef1f5; --text-dim: #8791a0; --text-dimmer: #4d5566; --accent: #4fd1b0;
    --warn: #e0ac2e; --bad: #e05353;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at top, #131a29 0%, var(--bg) 60%);
    color: var(--text); font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 22px 18px 60px; }

  header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 10px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-dim); margin: 0 0 4px; }
  h1 { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  a.back { color: var(--text-dim); text-decoration: none; font-size: 13px; }

  .server-box { display: flex; gap: 8px; margin-bottom: 20px; }
  .server-box input {
    flex: 1; background: var(--panel-solid); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); padding: 10px 12px; font-family: 'Inter', sans-serif; font-size: 12.5px;
  }
  .server-box button {
    background: var(--panel-solid); border: 1px solid var(--border); border-radius: 10px; color: var(--text-dim);
    padding: 0 14px; cursor: pointer; font-size: 12.5px;
  }

  .card { background: var(--panel-solid); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 14px; }

  /* --- sélection --- */
  .section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); margin: 18px 0 10px; }
  .select-row {
    display: flex; align-items: center; justify-content: space-between; padding: 11px 4px;
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .select-row:last-child { border-bottom: none; }
  .select-row .label { font-size: 14px; font-weight: 600; }
  .select-row .sub { font-size: 11.5px; color: var(--text-dim); }
  .checkbox {
    width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 12px;
  }
  .select-row.checked .checkbox { background: var(--accent); border-color: var(--accent); color: #061512; }

  button.primary {
    width: 100%; background: var(--accent); border: none; border-radius: 12px; color: #061512;
    font-weight: 700; font-size: 15px; padding: 14px; cursor: pointer; margin-top: 8px;
  }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary {
    width: 100%; background: var(--panel-solid); border: 1px solid var(--border); border-radius: 12px; color: var(--text);
    font-weight: 600; font-size: 14px; padding: 12px; cursor: pointer;
  }

  /* --- lecture --- */
  .progress-track { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 22px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s ease; }

  .step-kind { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 6px; }
  .step-label { font-size: 24px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.01em; }
  .step-meta { font-size: 13px; color: var(--text-dim); margin-bottom: 24px; }

  .timer-display { font-size: 56px; font-weight: 800; text-align: center; margin: 20px 0; font-variant-numeric: tabular-nums; }
  .timer-controls { display: flex; gap: 10px; margin-bottom: 10px; }

  .reps-input-row { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 24px 0; }
  .stepper-btn {
    width: 48px; height: 48px; border-radius: 50%; background: var(--panel-solid); border: 1px solid var(--border);
    color: var(--text); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .reps-value { font-size: 48px; font-weight: 800; min-width: 90px; text-align: center; font-variant-numeric: tabular-nums; }

  .delta-badge { text-align: center; font-size: 13px; font-weight: 600; margin-top: 4px; }
  .delta-badge.pos { color: var(--accent); }
  .delta-badge.neg { color: var(--bad); }
  .delta-badge.neutral { color: var(--text-dim); }

  /* --- bilan --- */
  .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .summary-row:last-child { border-bottom: none; }
  .summary-row .label { font-size: 14px; font-weight: 600; }
  .summary-row .values { font-size: 12px; color: var(--text-dim); }
  .summary-row .pct { font-size: 15px; font-weight: 700; }
  .coach-msg { font-size: 14px; line-height: 1.55; color: var(--text-dim); font-style: italic; margin-top: 6px; }

  .empty { text-align: center; color: var(--text-dimmer); font-size: 13px; padding: 30px 0; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">SPORTIA · SÉANCE</p>
      <h1 id="pageTitle">Séance guidée</h1>
    </div>
    <a class="back" href="index.html">← Accueil</a>
  </header>

  <div class="server-box">
    <input id="serverUrlInput" placeholder="URL du serveur">
    <button id="saveServerBtn">OK</button>
  </div>

  <div id="app"></div>
</div>

<script>
  const STORAGE_KEY = 'sportia_server_url';
  const serverUrlInput = document.getElementById('serverUrlInput');
  const app = document.getElementById('app');
  let serverUrl = localStorage.getItem(STORAGE_KEY) || '';
  serverUrlInput.value = serverUrl;

  document.getElementById('saveServerBtn').addEventListener('click', () => {
    serverUrl = serverUrlInput.value.trim().replace(/\/$/, '');
    localStorage.setItem(STORAGE_KEY, serverUrl);
    boot();
  });

  let catalog = null;
  let selected = { exercise_ids: new Set(), skill_ids: new Set() };
  let planItems = [];
  let sessionId = null;
  let stepIndex = 0;
  let timerInterval = null;
  let timerRemaining = 0;
  let repsValue = 0;

  async function api(path, opts) {
    const res = await fetch(serverUrl.replace(/\/$/, '') + path, {
      headers: { 'Content-Type': 'application/json' },
      ...opts,
    });
    return res.json();
  }

  function renderEmpty(msg) {
    app.innerHTML = `<div class="card"><p class="empty">${msg}</p></div>`;
  }

  async function boot() {
    if (!serverUrl) { renderEmpty("Renseigne l'URL de ton serveur ci-dessus pour commencer."); return; }
    renderEmpty("Chargement…");
    try {
      catalog = await api('/session/catalog');
      renderSelection();
    } catch (e) {
      renderEmpty("Impossible de joindre le serveur : " + e.message);
    }
  }

  function renderSelection() {
    document.getElementById('pageTitle').textContent = 'Choisis ta séance';
    let html = '<div class="card">';
    html += '<div class="section-title">Exercices de bilan</div>';
    catalog.exercises.forEach(ex => {
      const sub = ex.last_value != null ? `Dernière fois : ${ex.last_value} ${ex.unit === 'reps' ? 'reps' : 's'}` : 'Jamais testé';
      html += rowHtml('exercise_ids', ex.id, ex.label, sub);
    });
    html += '<div class="section-title">Figures</div>';
    catalog.skills.forEach(s => {
      const sub = s.last_value != null ? `Dernière fois : ${s.last_value} ${s.unit === 'reps' ? 'reps' : 's'}` : 'Jamais testée';
      html += rowHtml('skill_ids', s.id, s.label, sub);
    });
    html += '</div>';
    html += '<button class="primary" id="startBtn" disabled>Commencer la séance</button>';
    app.innerHTML = html;

    document.querySelectorAll('.select-row').forEach(row => {
      row.addEventListener('click', () => {
        const group = row.dataset.group, id = row.dataset.id;
        const set = selected[group];
        if (set.has(id)) set.delete(id); else set.add(id);
        row.classList.toggle('checked');
        row.querySelector('.checkbox').textContent = set.has(id) ? '✓' : '';
        document.getElementById('startBtn').disabled = selected.exercise_ids.size === 0 && selected.skill_ids.size === 0;
      });
    });
    document.getElementById('startBtn').addEventListener('click', startSession);
  }

  function rowHtml(group, id, label, sub) {
    return `<div class="select-row" data-group="${group}" data-id="${id}">
      <div><div class="label">${label}</div><div class="sub">${sub}</div></div>
      <div class="checkbox"></div>
    </div>`;
  }

  async function startSession() {
    renderEmpty("Génération de la séance…");
    const body = { exercise_ids: [...selected.exercise_ids], skill_ids: [...selected.skill_ids] };
    const data = await api('/session/plan', { method: 'POST', body: JSON.stringify(body) });
    if (data.status !== 'ok') { renderEmpty(data.detail || "Erreur."); return; }
    sessionId = data.session_id;
    planItems = data.items;
    stepIndex = 0;
    renderStep();
  }

  function renderStep() {
    if (stepIndex >= planItems.length) { finishSession(); return; }
    const item = planItems[stepIndex];
    document.getElementById('pageTitle').textContent =
      item.kind === 'warmup' ? 'Échauffement' : item.kind === 'cooldown' ? 'Étirements' : 'Exercice';

    const progressPct = Math.round((stepIndex / planItems.length) * 100);
    let html = `<div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>`;
    html += '<div class="card">';
    html += `<div class="step-kind">${item.kind === 'warmup' ? 'Échauffement' : item.kind === 'cooldown' ? 'Étirement' : (item.type === 'skill' ? 'Figure' : 'Exercice')}</div>`;
    html += `<p class="step-label">${item.label}</p>`;

    if (item.unit === 'seconds' && (item.kind === 'warmup' || item.kind === 'cooldown')) {
      html += `<p class="step-meta">${item.target_value} secondes</p>`;
      html += `<div class="timer-display" id="timerDisplay">${item.target_value}s</div>`;
      html += `<div class="timer-controls"><button class="secondary" id="timerStartBtn">Démarrer le chrono</button></div>`;
      html += `<button class="primary" id="validateBtn">Passer / Terminé</button>`;
    } else if (item.unit === 'seconds') {
      const metaText = item.previous_value != null
        ? `Dernière fois : ${item.previous_value}s — essaie d'atteindre ${item.target_value}s`
        : "Première fois — tiens le plus longtemps possible, ce sera ta référence.";
      html += `<p class="step-meta">${metaText}</p>`;
      html += `<div class="timer-display" id="timerDisplay">0s</div>`;
      html += `<div class="timer-controls"><button class="secondary" id="timerStartBtn">Démarrer</button><button class="secondary" id="timerStopBtn" style="display:none">Arrêter</button></div>`;
      html += `<button class="primary" id="validateBtn" disabled>Valider ce temps</button>`;
    } else {
      const metaText = item.previous_value != null
        ? `Dernière fois : ${item.previous_value} — essaie d'atteindre ${item.target_value}`
        : "Première fois — fais-en un maximum, ce sera ta référence.";
      html += `<p class="step-meta">${metaText}</p>`;
      repsValue = item.target_value != null ? Math.round(item.target_value) : 0;
      html += `<div class="reps-input-row">
        <button class="stepper-btn" id="repsMinus">−</button>
        <div class="reps-value" id="repsValue">${repsValue}</div>
        <button class="stepper-btn" id="repsPlus">+</button>
      </div>`;
      html += `<button class="primary" id="validateBtn">Valider</button>`;
    }
    html += `<div id="deltaBadge"></div>`;
    html += '</div>';
    app.innerHTML = html;
    wireStep(item);
  }

  function wireStep(item) {
    if (item.kind === 'warmup' || item.kind === 'cooldown') {
      let remaining = item.target_value;
      const display = document.getElementById('timerDisplay');
      document.getElementById('timerStartBtn').addEventListener('click', (e) => {
        e.target.disabled = true;
        timerInterval = setInterval(() => {
          remaining -= 1;
          display.textContent = Math.max(remaining, 0) + 's';
          if (remaining <= 0) {
            clearInterval(timerInterval);
            display.textContent = "C'est bon !";
          }
        }, 1000);
      });
      document.getElementById('validateBtn').addEventListener('click', async () => {
        clearInterval(timerInterval);
        await api('/session/log', { method: 'POST', body: JSON.stringify({ item_id: item.item_id, actual_value: item.target_value }) });
        stepIndex++; renderStep();
      });
      return;
    }

    if (item.unit === 'seconds') {
      let elapsed = 0;
      const display = document.getElementById('timerDisplay');
      const startBtn = document.getElementById('timerStartBtn');
      const stopBtn = document.getElementById('timerStopBtn');
      const validateBtn = document.getElementById('validateBtn');
      startBtn.addEventListener('click', () => {
        startBtn.style.display = 'none'; stopBtn.style.display = 'inline-block';
        timerInterval = setInterval(() => { elapsed += 1; display.textContent = elapsed + 's'; }, 1000);
      });
      stopBtn.addEventListener('click', () => {
        clearInterval(timerInterval);
        stopBtn.style.display = 'none';
        validateBtn.disabled = false;
      });
      validateBtn.addEventListener('click', () => validateMain(item, elapsed));
      return;
    }

    // reps
    document.getElementById('repsMinus').addEventListener('click', () => {
      repsValue = Math.max(0, repsValue - 1);
      document.getElementById('repsValue').textContent = repsValue;
    });
    document.getElementById('repsPlus').addEventListener('click', () => {
      repsValue += 1;
      document.getElementById('repsValue').textContent = repsValue;
    });
    document.getElementById('validateBtn').addEventListener('click', () => validateMain(item, repsValue));
  }

  async function validateMain(item, actualValue) {
    const data = await api('/session/log', { method: 'POST', body: JSON.stringify({ item_id: item.item_id, actual_value: actualValue }) });
    const badge = document.getElementById('deltaBadge');
    if (data.pct != null) {
      const cls = data.pct > 0 ? 'pos' : data.pct < 0 ? 'neg' : 'neutral';
      badge.innerHTML = `<div class="delta-badge ${cls}">${data.pct > 0 ? '+' : ''}${data.pct}% par rapport à la dernière fois</div>`;
    } else {
      badge.innerHTML = `<div class="delta-badge neutral">Nouvelle référence enregistrée</div>`;
    }
    document.getElementById('validateBtn').disabled = true;
    setTimeout(() => { stepIndex++; renderStep(); }, 900);
  }

  async function finishSession() {
    renderEmpty("Calcul du bilan…");
    const data = await api('/session/finish', { method: 'POST', body: JSON.stringify({ session_id: sessionId }) });
    document.getElementById('pageTitle').textContent = 'Bilan de la séance';

    let html = '<div class="card">';
    if (data.deltas.length === 0) {
      html += '<p class="empty">Aucune donnée comparable pour cette séance.</p>';
    } else {
      data.deltas.forEach(d => {
        const unitLabel = d.unit === 'reps' ? '' : 's';
        const valuesText = d.previous_value != null
          ? `${d.previous_value}${unitLabel} → ${d.actual_value}${unitLabel}`
          : `${d.actual_value}${unitLabel} (référence)`;
        const pctText = d.pct != null ? `${d.pct > 0 ? '+' : ''}${d.pct}%` : '—';
        const cls = d.pct > 0 ? 'pos' : d.pct < 0 ? 'neg' : 'neutral';
        html += `<div class="summary-row">
          <div><div class="label">${d.label}</div><div class="values">${valuesText}</div></div>
          <div class="pct delta-badge ${cls}">${pctText}</div>
        </div>`;
      });
    }
    html += `<p class="coach-msg">${data.coach_message}</p>`;
    html += '</div>';
    html += '<button class="secondary" id="restartBtn">Nouvelle séance</button>';
    app.innerHTML = html;
    document.getElementById('restartBtn').addEventListener('click', boot);
  }

  boot();
</script>

</body>
</html>
