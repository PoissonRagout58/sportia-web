<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportIA — Figures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f18; --panel-solid: #131926; --border: #232b3a;
    --text: #eef1f5; --text-dim: #8791a0; --text-dimmer: #4d5566;
    --accent: #4fd1b0; --gold: #e0ac2e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(ellipse at top, #131a29 0%, var(--bg) 60%);
    color: var(--text); font-family: 'Inter', -apple-system, sans-serif; padding: 24px 18px 56px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header {
    display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 14px;
    margin-bottom: 26px;
  }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--text-dim); margin: 0 0 4px; }
  h1 { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .mock-note { font-size: 12px; color: var(--text-dimmer); max-width: 280px; text-align: right; line-height: 1.5; }

  .filters { display: flex; gap: 6px; margin-bottom: 22px; flex-wrap: wrap; }
  .filter {
    font-size: 12.5px; font-weight: 600; background: var(--panel-solid); border: 1px solid var(--border);
    color: var(--text-dim); padding: 8px 14px; border-radius: 20px; cursor: pointer; transition: all 0.15s ease;
  }
  .filter:hover { color: var(--text); border-color: #34405a; }
  .filter.active { color: var(--accent); border-color: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }

  .card {
    background: var(--panel-solid); border: 1px solid var(--border); border-radius: 12px; padding: 18px;
    cursor: pointer; transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .card:hover { border-color: #34405a; transform: translateY(-1px); }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .card-label { font-size: 16px; font-weight: 700; margin: 0; }
  .card-cat { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin: 3px 0 0; }
  .stars { color: var(--gold); font-size: 13px; letter-spacing: 1px; white-space: nowrap; }

  .bar-track { height: 6px; border-radius: 3px; background: #1a2130; overflow: hidden; margin: 12px 0 6px; }
  .bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #1c5c58, var(--accent)); transition: width 0.6s ease; }
  .card-pct { font-size: 20px; font-weight: 800; }
  .card-desc { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin-top: 8px; }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(4,7,12,0.72); z-index: 10;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--panel-solid); border: 1px solid var(--border); border-radius: 14px; padding: 24px;
    max-width: 420px; width: 100%; max-height: 85vh; overflow-y: auto;
  }
  .modal h2 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .modal .modal-cat { font-size: 11.5px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 14px; }
  .modal p.desc { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin-bottom: 18px; }
  .modal label { font-size: 11.5px; color: var(--text-dim); display: block; margin-bottom: 6px; }
  .modal input {
    width: 100%; background: #1a2130; border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 10px 12px; font-family: 'Inter', sans-serif; font-size: 14px; margin-bottom: 16px;
  }
  .modal .prog-title { font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-dim); margin: 18px 0 8px; }
  .prog-step {
    display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text); padding: 7px 0;
    border-bottom: 1px solid var(--border);
  }
  .prog-step:last-child { border-bottom: none; }
  .prog-num {
    width: 20px; height: 20px; border-radius: 50%; background: #1a2130; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 10.5px; color: var(--text-dim); flex-shrink: 0;
  }
  .btn-row { display: flex; gap: 10px; margin-top: 6px; }
  button.action {
    font-size: 13px; font-weight: 600; padding: 10px 16px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border);
    background: #1a2130; color: var(--text);
  }
  button.action.primary { background: var(--accent); border-color: var(--accent); color: #061512; }
  button.close-x { position: absolute; top: 16px; right: 20px; background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; }
  .modal { position: relative; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">SportIA · Progression</p>
      <h1>Figures & maîtrise</h1>
    </div>
    <p class="mock-note">Données d'exemple — à brancher sur GET /skills et POST /skills/assessment du backend FitCoach.</p>
  </header>

  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>

<script>
  // ---------------------------------------------------------------------
  // Miroir de skills.py (fitcoach/skills.py) — à remplacer par un fetch('/skills')
  // ---------------------------------------------------------------------
  // Données d'exemple par défaut (utilisées si aucun serveur n'est configuré ou injoignable)
  let SKILLS = [
    {id:'pompes', label:'Pompes', category:'poussée', difficulty:1, unit:'reps', mastery_pct:78, last_value:42, description:"Pompes strictes au poids du corps, amplitude complète.", progression:["Pompes sur genoux","Pompes inclinées","Pompes strictes","Pompes lestées"]},
    {id:'squats', label:'Squats', category:'jambes', difficulty:1, unit:'reps', mastery_pct:82, last_value:55, description:"Squats au poids du corps, cuisses parallèles au sol.", progression:["Squats sur banc","Squats complets","Squats bulgares","Pistol squat assisté"]},
    {id:'pistol_squat', label:'Pistol squat', category:'jambes', difficulty:3, unit:'reps', mastery_pct:20, last_value:1, description:"Squat complet sur une jambe, l'autre tendue devant.", progression:["Pistol assisté (appui/élastique)","Pistol sur boîte","Pistol complet","Pistol lesté"]},
    {id:'tractions', label:'Tractions', category:'tirage', difficulty:2, unit:'reps', mastery_pct:60, last_value:8, description:"Tractions pronation, menton au-dessus de la barre.", progression:["Suspension (dead hang)","Tractions assistées (élastique)","Tractions strictes","Tractions lestées"]},
    {id:'muscle_up', label:'Muscle-up', category:'tirage', difficulty:4, unit:'reps', mastery_pct:0, last_value:null, description:"Traction explosive enchaînée avec un passage en dips.", progression:["Tractions explosives (poitrine à la barre)","Transition au sol","Muscle-up assisté","Muscle-up strict"]},
    {id:'dragon_flag', label:'Dragon Flag', category:'gainage', difficulty:3, unit:'reps', mastery_pct:35, last_value:1, description:"Corps tendu et rigide, seules les épaules restent au contact du banc.", progression:["Gainage planche","Dragon flag genoux fléchis","Dragon flag négatif","Dragon flag complet"]},
    {id:'handstand', label:'Handstand (ATR)', category:'statique', difficulty:3, unit:'seconds', mastery_pct:30, last_value:5, description:"Équilibre sur les mains en appui libre, sans mur.", progression:["Handstand au mur (face au mur)","Handstand au mur (dos au mur)","Décollés de mur","Handstand libre"]},
    {id:'front_lever', label:'Front Lever', category:'statique', difficulty:4, unit:'seconds', mastery_pct:0, last_value:null, description:"Suspendu à la barre, corps tendu à l'horizontale face au sol.", progression:["Front lever tuck","Front lever advanced tuck","Front lever one leg","Front lever complet"]},
    {id:'back_lever', label:'Back Lever', category:'statique', difficulty:4, unit:'seconds', mastery_pct:0, last_value:null, description:"Suspendu à la barre, corps tendu à l'horizontale face au ciel.", progression:["Back lever tuck","Back lever advanced tuck","Back lever one leg","Back lever complet"]},
    {id:'planche', label:'Planche complète', category:'statique', difficulty:5, unit:'seconds', mastery_pct:0, last_value:null, description:"Corps tendu à l'horizontale en appui sur les mains, jambes tendues.", progression:["Planche lean","Tuck planche","Advanced tuck planche","Straddle planche","Planche complète"]},
    {id:'drapeau', label:'Drapeau (Human Flag)', category:'statique', difficulty:5, unit:'seconds', mastery_pct:0, last_value:null, description:"Corps tendu à l'horizontale, en appui latéral sur une barre verticale.", progression:["Gainage oblique renforcé","Drapeau genoux fléchis","Drapeau une jambe tendue","Drapeau complet"]},
    {id:'one_arm_pullup', label:'Traction à un bras', category:'tirage', difficulty:5, unit:'reps', mastery_pct:0, last_value:null, description:"Traction complète en n'utilisant qu'un seul bras.", progression:["Tractions lestées lourdes","Tractions archer","Négatives à un bras","Traction à un bras assistée"]},
    {id:'iron_cross', label:'Iron Cross (anneaux)', category:'statique', difficulty:5, unit:'seconds', mastery_pct:0, last_value:null, description:"Bras tendus à l'horizontale en croix, en appui sur des anneaux. Nécessite des anneaux.", progression:["Support statique aux anneaux","Iron cross assisté (élastique)","Négatives iron cross","Iron cross complet"]},
  ];

  let categories = ['tous', ...new Set(SKILLS.map(s => s.category))];
  let activeFilter = 'tous';

  function stars(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); }

  function renderFilters() {
    const el = document.getElementById('filters');
    el.innerHTML = '';
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'filter' + (cat === activeFilter ? ' active' : '');
      btn.textContent = cat;
      btn.addEventListener('click', () => { activeFilter = cat; renderFilters(); renderGrid(); });
      el.appendChild(btn);
    });
  }

  function renderGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const list = activeFilter === 'tous' ? SKILLS : SKILLS.filter(s => s.category === activeFilter);
    list.sort((a,b) => b.mastery_pct - a.mastery_pct);
    list.forEach(skill => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-top">
          <div>
            <p class="card-label">${skill.label}</p>
            <p class="card-cat">${skill.category}</p>
          </div>
          <span class="stars">${stars(skill.difficulty)}</span>
        </div>
        <div class="card-pct">${skill.mastery_pct}%</div>
        <div class="bar-track"><div class="bar-fill" style="width:${skill.mastery_pct}%"></div></div>
        <p class="card-desc">${skill.description}</p>
      `;
      card.addEventListener('click', () => openModal(skill));
      grid.appendChild(card);
    });
  }

  function openModal(skill) {
    const overlay = document.getElementById('modalOverlay');
    const modal = document.getElementById('modal');
    modal.innerHTML = `
      <button class="close-x" id="closeModal">&times;</button>
      <h2>${skill.label}</h2>
      <p class="modal-cat">${skill.category} · ${stars(skill.difficulty)}</p>
      <p class="desc">${skill.description}</p>

      <label>Nouvelle performance (${skill.unit === 'reps' ? 'répétitions' : 'secondes tenues'})</label>
      <input type="number" id="valueInput" placeholder="${skill.last_value ?? 0}" min="0" step="0.5">

      <div class="btn-row">
        <button class="action primary" id="submitAssessment">Enregistrer le bilan</button>
      </div>

      <p class="prog-title">Étapes de progression</p>
      ${skill.progression.map((step, i) => `
        <div class="prog-step">
          <span class="prog-num">${i+1}</span>
          <span>${step}</span>
        </div>
      `).join('')}
    `;
    overlay.classList.add('open');
    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('submitAssessment').addEventListener('click', async () => {
      const val = parseFloat(document.getElementById('valueInput').value);
      if (isNaN(val)) return;
      const serverUrl = localStorage.getItem('sportia_server_url');
      if (!serverUrl) {
        alert("Aucun serveur configuré — retourne à l'accueil pour renseigner l'URL.");
        return;
      }
      try {
        const res = await fetch(serverUrl.replace(/\/$/, '') + '/skills/assessment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ skill_id: skill.id, value: val }),
        });
        const data = await res.json();
        if (data.status === 'ok') {
          skill.mastery_pct = data.mastery_pct;
          skill.last_value = val;
          closeModal();
          renderGrid();
        } else {
          alert(data.detail || "Erreur lors de l'enregistrement.");
        }
      } catch (e) {
        alert("Impossible de joindre le serveur : " + e.message);
      }
    });
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
  }
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'modalOverlay') closeModal();
  });

  async function loadLiveSkills() {
    const serverUrl = localStorage.getItem('sportia_server_url');
    if (!serverUrl) return;
    try {
      const res = await fetch(serverUrl.replace(/\/$/, '') + '/skills', { signal: AbortSignal.timeout(4000) });
      if (res.ok) SKILLS = await res.json();
    } catch (e) {
      // Serveur injoignable : on garde les données d'exemple, pas d'interruption pour l'utilisateur
    }
  }

  (async () => {
    await loadLiveSkills();
    categories = ['tous', ...new Set(SKILLS.map(s => s.category))];
    renderFilters();
    renderGrid();
  })();
</script>

</body>
</html>
